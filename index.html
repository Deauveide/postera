<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Viewport sin zoom para que la experiencia AR ocupe toda la pantalla -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Apunta la cámara a un poster impreso y mira cómo cobra vida en realidad aumentada.">
  <meta name="theme-color" content="#0f1222">
  <!-- Icono en línea: evita una petición 404 a /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='8' width='36' height='48' rx='4' fill='none' stroke='%23ffb84d' stroke-width='3'/%3E%3C/svg%3E">
  <title>Posters animados AR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ Estado de carga ============
       No hay pantalla de inicio: la cámara se abre en cuanto carga la página. -->
  <div id="estado-carga" class="pantalla" role="status" aria-live="polite">
    <div class="tarjeta">
      <!-- Texto alternativo del icono decorativo para lectores de pantalla -->
      <svg class="icono" viewBox="0 0 64 64" role="img" aria-label="Icono de un poster con una marca de realidad aumentada">
        <rect x="14" y="8" width="36" height="48" rx="4" fill="none" stroke="#ffb84d" stroke-width="3"/>
        <path d="M24 30 L30 36 L42 24" fill="none" stroke="#ffb84d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="46" r="2.5" fill="#ffb84d"/>
      </svg>
      <div class="spinner" aria-hidden="true"></div>
      <p id="texto-carga">Abriendo la cámara…</p>
      <p class="nota">Si el navegador lo pide, permite el acceso a la cámara.</p>
    </div>
  </div>

  <!-- ============ Sobre la cámara (visible cuando la AR está lista) ============ -->
  <div id="capa-ar" hidden>
    <p id="aviso-escaneo" class="aviso-escaneo" role="status">Apunta la cámara a un poster</p>
    <button id="btn-sonido" class="boton-principal boton-sonido" type="button" hidden>Activar sonido</button>
  </div>

  <!-- ============ Estado de error ============ -->
  <div id="estado-error" class="pantalla" role="alert" hidden>
    <div class="tarjeta">
      <h2>No se pudo iniciar</h2>
      <p id="texto-error"></p>
      <button id="btn-reintentar" class="boton-principal" type="button">Volver a intentar</button>
      <button id="btn-sin-camara-error" class="boton-secundario" type="button" hidden>Ver los posters sin cámara</button>
    </div>
  </div>

  <!-- ============ Modo sin cámara ============
       Muestra cada poster con su imagen y su vídeo, sin AR. app.js rellena la lista. -->
  <main id="modo-sin-camara" class="pantalla pantalla-scroll" hidden>
    <div class="contenido-scroll">
      <h1>Posters sin cámara</h1>
      <p>Así se ven los posters. Para ver la animación sobre el poster impreso, usa la cámara.</p>
      <div id="lista-sin-camara" class="lista-sin-camara"></div>
      <button id="btn-volver-inicio" class="boton-secundario" type="button">Usar la cámara</button>
    </div>
  </main>

  <!-- Contenedor donde app.js crea la escena A-Frame + MindAR -->
  <div id="contenedor-ar"></div>

  <!-- Vídeos de los posters: viven fuera de la vista pero deben seguir reproduciéndose -->
  <div id="medios" aria-hidden="true"></div>

  <!-- Librerías locales (sin CDN) -->
  <script src="vendor/aframe-1.8.0.min.js"></script>
  <script src="vendor/mindar-image-aframe-1.2.5.prod.js"></script>
  <!-- Escenas en código (tipo "escena" en posters.json) -->
  <script src="js/escenas/cartas-del-alma.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
